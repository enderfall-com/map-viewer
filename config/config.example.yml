# minecraft-map configuration.
#
# Every value below is the built-in default, so a file containing only the keys
# you want to change is valid. Paths are resolved relative to this file.

server:
  port: 8080
  host: "0.0.0.0"
  # Serve a built frontend from the same origin. Leave empty when running the
  # Vite dev server, which proxies to this backend instead.
  frontendDir: ""
  # Origins allowed to call the API cross-origin. Empty means same-origin only.
  corsOrigins: []
  readTimeout: 30s
  writeTimeout: 120s

minecraft:
  # Path to the world directory (the one containing level.dat and region/).
  worldPath: "./world"
  # Replace the world reader with generated sample terrain. Lets the whole
  # stack run with no Minecraft installation at all.
  demo: false
  demoSeed: 1592232500
  demoRadius: 6000
  # Dimensions whose layout discovery cannot infer. Map a dimension id to the
  # directory holding its region/ folder.
  extraDimensionPaths: {}
    # "some_mod:moon": "./world/dimensions/some_mod/moon"
  # Bounds decoded chunk surfaces held in memory. Each chunk costs ~2 KB, so
  # 256 MB holds well over a hundred thousand chunks.
  chunkCacheBytes: 268435456
  # How many region files stay open. Each holds one file descriptor.
  regionCacheFiles: 64
  # Bounds the separate cache of per-chunk voxel slabs used by the isometric
  # voxel renderer (render.isoVoxel). Slab size varies a lot per chunk (a
  # flat plains chunk vs. a tall jungle canopy), so this is its own budget
  # rather than sharing chunkCacheBytes.
  voxelCacheBytes: 536870912

tiles:
  directory: "./data/tiles"
  # Must stay 512: the pyramid arithmetic depends on it.
  size: 512
  format: webp      # webp (lossless, pure Go) or png
  quality: 90
  workers: 8
  maxQueuedTiles: 5000

  # The zoom at which tiles are rendered from world data. Levels below are
  # built by downsampling children; levels above are magnified by the browser
  # with nearest-neighbour filtering, which costs no storage and keeps blocks
  # crisp.
  #
  # Raise this only when textures.enabled is true below. One pixel per block
  # (the default) is exactly a flat colour either way, so there is nothing to
  # gain from a higher base zoom without real texture detail to resolve --
  # only more tiles to generate and store. 10 gives 16 pixels per block,
  # matching a native 16x16 texture pack exactly; every level below the base
  # zoom is generated by downsampling, so raising it multiplies both the
  # number of stored tiles and the pre-generation time roughly 4x per extra
  # level (16x for four levels, i.e. going from 6 to 10).
  topBaseZoom: 6
  # Isometric cannot go below 7: at zoom 6 the diamond lattice needs half-pixel
  # alignment and cannot tessellate. 8 is a good quality/size balance with flat
  # colours; raise to 10 alongside topBaseZoom for full-resolution textures in
  # isometric mode too, same storage/generation-time trade-off as above.
  isoBaseZoom: 8

  # How many pyramid levels one on-demand request may build recursively.
  # Keeps a request for an ungenerated low-zoom tile from cascading.
  maxCompositeDepth: 3
  memoryCacheBytes: 201326592
  # Writing fully-unexplored tiles wastes a lot of space on sparse worlds.
  storeBlankTiles: false

  # Sweep the world border in the background on startup.
  pregenerate: false
  pregenerateMaxZoom: 6

  styles: ["terrain"]        # terrain, biome, height
  modes: ["top", "iso"]

map:
  minZoom: 0
  maxZoom: 10
  # Raises the effective minimum zoom (how far the view may zoom out) in
  # isometric mode only; top-down can still zoom out to minZoom. <= 0
  # disables this. Defaults to 6, roughly where the scale bar reads "100
  # blocks" -- below that, isometric tiles are downsampled composites rather
  # than directly rendered from world data.
  isoMinZoom: 6
  defaultZoom: 5
  defaultDimension: "minecraft:overworld"
  defaultMode: "top"
  defaultStyle: "terrain"
  constrainToBorder: false
  title: "EnderFall Map"

# Zoom thresholds for progressive detail. Overlays appear only once they are
# readable, which is what keeps a zoomed-out view legible.
overlays:
  chunkGridMinZoom: 7
  blockGridMinZoom: 9
  playersMinZoom: 2
  claimsMinZoom: 1
  regionsMinZoom: 0
  markersMinZoom: 3
  labelsMinZoom: 4

render:
  heightShading: true
  # Pronounced relief shading: individual tree canopies and hillside contours
  # read as real depth in top-down mode. Lower this (try 0.085) for a
  # subtler, flatter look.
  shadingStrength: 0.35
  # Caps how many blocks of elevation delta contribute, so a cliff does not
  # saturate to pure white and black. Lower than shadingStrength's old
  # pairing (was 6) so small, few-block bumps -- a forest floor, a single
  # tree's canopy edge -- still show up clearly instead of being washed out.
  shadingClamp: 3
  ambientHeight: 0.10
  biomeTint: true
  waterDepthShading: true
  maxWaterDepth: 28
  # Modulate by stored block light. Reveals lit interiors; off by default
  # because it makes unlit terrain darker than most people expect.
  lightShading: false
  unexploredColor: "#14161a"
  # Isometric camera corner: se, sw, nw or ne. Only se is rendered today.
  isoCamera: "se"
  isoEdgeSkirt: 4

  # Render the isometric view from real per-column block data (trunks,
  # overhangs, cave mouths) instead of extruding just the topmost block down
  # to the nearest neighbour's height. false keeps the older, cheaper
  # heightmap renderer. Falls back silently (logged once) if the active
  # world provider cannot supply voxel data, e.g. minecraft.demo.
  isoVoxel: true
  # Layers stored below each chunk's deepest solid surface, beyond whatever
  # canopy height already demands.
  isoVoxelBelowGround: 16
  isoVoxelMinDepth: 8
  # Hard cap on per-chunk voxel slab depth, regardless of canopy height.
  isoVoxelMaxDepth: 64

data:
  blocksFile: "./blocks.json"
  biomesFile: "./biomes.json"
  # Directories of *-blocks.json / *-biomes.json overlays, layered on top.
  overlayDirs: []
  # Seed claims, regions and markers without a live server plugin.
  featuresFile: ""

# Real Minecraft block textures, read straight out of a game installation
# instead of (or alongside) blocks.json's flat colours. Never bundled with
# the server -- texture packs are the operator's own licensed game files.
#
# Resolution always degrades gracefully: a block whose model is not a simple
# full cube (stairs, slabs, fences, fluids, crops, and anything else with
# non-cube geometry), or whose pack does not cover it, or this whole section
# left disabled, simply keeps its blocks.json flat colour. Pair this with
# raising tiles.topBaseZoom / tiles.isoBaseZoom above once enabled, or the
# extra detail has no pixels to render into.
textures:
  enabled: false
  # Read in priority order; a later source overrides an earlier one at the
  # same asset path, exactly like Minecraft's own resource-pack stacking.
  # Each entry is a .jar/.zip archive, a directory of *.jar/*.zip archives
  # (loaded alphabetically -- point this at a mods/ folder directly), or a
  # directory of already-extracted loose assets.
  sources: []
    # - "C:/Users/you/AppData/Roaming/.minecraft/versions/1.21.1/1.21.1.jar"
    # - "C:/Users/you/AppData/Roaming/.minecraft/mods"
    # - "C:/Users/you/AppData/Roaming/.minecraft/resourcepacks/Some Pack.zip"

live:
  enabled: true
  playerPollSeconds: 2
  # Poll region file timestamps to detect chunk changes.
  watchWorld: true
  watchIntervalSeconds: 5
  # How long a chunk must be quiet before its tiles regenerate. Coalesces the
  # burst of edits a building player produces.
  dirtySettleSeconds: 3
  maxConnections: 500
  # Bearer token required by POST /api/ingest/*, which lets a server plugin
  # push real player positions and features instead of relying on demo data
  # or a static featuresFile. Empty (the default) disables ingestion entirely.
  ingestToken: ""

log:
  level: info       # debug, info, warn, error
  format: text      # text or json
